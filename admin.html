<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏鑫荣 - 价格后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F3A76',
                        secondary: '#235299',
                        light: '#F3F7FC'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 3px 14px 0 rgba(15, 58, 118, 0.1);
            }
            .lock-scroll {
                overflow:hidden !important;
            }
        }
        /* 登录遮罩 彻底修复铺满全屏 */
        .login-modal {
            position: fixed;
            top:0;
            left:0;
            width:100vw;
            height:100vh;
            background: rgba(0,0,0,0.55);
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:9999;
            padding:16px;
        }
    </style>
</head>
<body class="bg-light min-h-screen py-6 px-4 md:px-6">

<!-- 登录弹窗 -->
<div class="login-modal" id="loginBox">
    <div class="bg-white rounded-lg card-shadow p-6 w-full max-w-sm">
        <h2 class="text-xl font-bold text-primary text-center mb-4">
            <i class="fa fa-lock mr-2"></i>后台权限验证
        </h2>
        <input id="passwordInput" type="password" placeholder="请输入管理员密码"
               class="w-full border border-gray-300 rounded px-3 py-2 mb-4 outline-primary">
        <button onclick="loginCheck()" class="w-full bg-primary text-white py-2.5 rounded font-medium">
            登录进入后台
        </button>
        <p class="text-red-500 text-sm mt-3 text-center hidden" id="errorTip">密码不正确，请重试</p>
    </div>
</div>

<!-- 主编辑区域（初始隐藏） -->
<div class="max-w-5xl mx-auto hidden" id="mainContainer">
    <header class="mb-6">
        <h1 class="text-[clamp(1.4rem,2vw,1.8rem)] font-bold text-primary">
            <i class="fa fa-cog mr-2"></i>华夏鑫荣（河北）价格数据管理后台
        </h1>
        <p class="text-gray-500 mt-1 text-sm">数据文件地址：https://cdn.jsdelivr.net/gh/ghzzy17627871234@gmail.comHXXR/data.json</p>
    </header>

    <div class="space-y-5 bg-white rounded-lg card-shadow p-6">
        <div>
            <label class="block font-semibold mb-1 text-primary">最后更新日期 updateTime</label>
            <input id="inputUpdateTime" class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">B1级 【一行一条，格式：规格,价格】</label>
            <textarea id="txtB1" rows="5" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">B2级 【一行一条，格式：规格,价格】</label>
            <textarea id="txtB2" rows="6" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">检测级 【一行一条，格式：规格,价格】</label>
            <textarea id="txtTest" rows="8" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">EPS聚苯系列 【一行一条，格式：名称,价格】</label>
            <textarea id="txtEPS" rows="4" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">保温砂浆系列 【一行一条，格式：名称,价格】</label>
            <textarea id="txtMortar" rows="6" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">加价补充说明（一行一条）</label>
            <textarea id="txtNote" rows="5" class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <div class="flex flex-wrap gap-3 pt-2">
            <button onclick="fetchRemoteData()" class="bg-primary text-white px-4 py-2 rounded">
                <i class="fa fa-download mr-1"></i>拉取线上最新数据
            </button>
            <button onclick="generateJson()" class="bg-green-600 text-white px-4 py-2 rounded">
                <i class="fa fa-code mr-1"></i>生成JSON文本
            </button>
            <button onclick="copyJson()" class="bg-orange-500 text-white px-4 py-2 rounded">
                <i class="fa fa-copy mr-1"></i>复制JSON内容
            </button>
        </div>

        <div>
            <label class="block font-semibold mb-1 text-primary">生成结果（复制全部内容覆盖data.json）</label>
            <textarea id="outJson" rows="14" readonly class="w-full border rounded px-3 py-2 bg-gray-50"></textarea>
        </div>

        <div class="text-sm text-gray-500 pt-2 border-t">
            <p>操作步骤：拉取线上数据 → 修改价格 → 生成JSON → 复制全部 → Github替换data.json提交</p>
            <p class="text-red-500">⚠️ 文件更新后，前台页面强制刷新才能生效！</p>
            <a href="./index.html" class="text-primary underline inline-block mt-2">← 返回价格展示首页</a>
        </div>
    </div>
</div>

<script>
// =====================在这里修改管理员登录密码=====================
const ADMIN_PASSWORD = "Zzy091500.";
// =================================================================
const DATA_URL = "https://cdn.jsdelivr.net/gh/ghzzy17627871234@gmail.comHXXR/data.json";
let resultJsonText = "";

// 登录验证
function loginCheck(){
    const val = document.getElementById("passwordInput").value.trim();
    const errTip = document.getElementById("errorTip");
    if(val === ADMIN_PASSWORD){
        document.getElementById("loginBox").classList.add("hidden");
        document.body.classList.remove("lock-scroll");
        document.getElementById("mainContainer").classList.remove("hidden");
    }else{
        errTip.classList.remove("hidden");
    }
}
// 页面打开直接锁定滚动，禁止底层滑动
document.body.classList.add("lock-scroll");

// 回车登录
document.getElementById("passwordInput").addEventListener("keydown",e=>{
    if(e.key === "Enter") loginCheck();
})

// 文本转数组
function textToItemArray(text){
    const list = [];
    text.trim().split("\n").forEach(line=>{
        const arr = line.split(",");
        const name = arr[0]?.trim();
        const price = parseFloat(arr[1]?.trim());
        if(name && !isNaN(price)){
            list.push({size:name, price:price})
        }
    })
    return list;
}
// 数组转回文本
function itemArrayToText(arr){
    return arr.map(item=>`${item.size},${item.price}`).join("\n");
}

// 拉取远程数据
async function fetchRemoteData(){
    try{
        const res = await fetch(DATA_URL + "?t=" + Date.now());
        const data = await res.json();
        document.getElementById("inputUpdateTime").value = data.updateTime;
        document.getElementById("txtB1").value = itemArrayToText(data.B1);
        document.getElementById("txtB2").value = itemArrayToText(data.B2);
        document.getElementById("txtTest").value = itemArrayToText(data.test);
        document.getElementById("txtEPS").value = itemArrayToText(data.EPS);
        document.getElementById("txtMortar").value = itemArrayToText(data.mortar);
        document.getElementById("txtNote").value = data.extraNotes.join("\n");
        alert("✅ 线上数据加载成功");
    }catch(err){
        alert("❌ 数据拉取失败："+err.message);
    }
}

// 组装json
function generateJson(){
    const dataObj = {
        updateTime: document.getElementById("inputUpdateTime").value.trim(),
        B1: textToItemArray(document.getElementById("txtB1").value),
        B2: textToItemArray(document.getElementById("txtB2").value),
        test: textToItemArray(document.getElementById("txtTest").value),
        EPS: textToItemArray(document.getElementById("txtEPS").value),
        mortar: textToItemArray(document.getElementById("txtMortar").value),
        extraNotes: document.getElementById("txtNote").value.trim().split("\n").map(s=>s.trim())
    };
    resultJsonText = JSON.stringify(dataObj,null,4);
    document.getElementById("outJson").value = resultJsonText;
}

// 复制json
function copyJson(){
    if(!resultJsonText){
        alert("请先生成JSON文本！");
        return;
    }
    navigator.clipboard.writeText(resultJsonText).then(()=>{
        alert("✅ JSON已复制，前往Github替换data.json");
    })
}
</script>
</body>
</html>
