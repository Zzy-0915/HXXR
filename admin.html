<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 华夏鑫荣挤塑价格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F3A76',
                        secondary: '#235299',
                        light: '#F3F7FC'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 3px 14px 0 rgba(15, 58, 118, 0.1);
            }
        }
    </style>
</head>
<body class="bg-light min-h-screen py-8 px-4 md:px-6">
    <div class="max-w-7xl mx-auto">
        <!-- 登录区域 -->
        <div id="loginBox" class="max-w-md mx-auto bg-white rounded-lg card-shadow p-8">
            <h2 class="text-xl font-bold text-primary text-center mb-6">
                <i class="fa fa-lock mr-2"></i>价格后台登录
            </h2>
            <div class="mb-4">
                <label class="block mb-2 text-gray-700">请输入管理密码</label>
                <input id="pwdInput" type="password" class="w-full border border-gray-300 rounded px-3 py-3 focus:outline-none focus:border-primary" placeholder="输入密码">
            </div>
            <div id="errTip" class="text-red-500 mb-4 hidden">密码错误，请重新输入！</div>
            <button onclick="login()" class="w-full bg-primary text-white py-3 rounded hover:bg-secondary transition">
                <i class="fa fa-sign-in mr-1"></i>登录进入后台
            </button>
            <div class="mt-4 text-center">
                <a href="index.html" class="text-primary text-sm"><i class="fa fa-arrow-left"></i> 返回价格首页</a>
            </div>
        </div>


        <!-- 后台编辑区域（登录成功后显示） -->
        <div id="adminPanel" class="hidden">
            <header class="flex flex-wrap justify-between items-center mb-6">
                <div>
                    <h1 class="text-[clamp(1.4rem,3vw,2rem)] font-bold text-primary">
                        <i class="fa fa-cog mr-2"></i>华夏鑫荣价格数据管理后台
                    </h1>
                    <p class="text-gray-500 mt-1">修改价格后复制下方JSON，手动上传覆盖data.json</p>
                </div>
                <div class="flex gap-3 mt-3 md:mt-0">
                    <button onclick="fillCurrentDate()" class="bg-green-600 text-white px-4 py-2 rounded">
                        <i class="fa fa-calendar"></i> 填充今日日期
                    </button>
                    <button onclick="copyJson()" class="bg-primary text-white px-4 py-2 rounded">
                        <i class="fa fa-copy"></i> 复制最终JSON
                    </button>
                    <button onclick="logout()" class="bg-gray-500 text-white px-4 py-2 rounded">
                        <i class="fa fa-sign-out"></i>退出
                    </button>
                </div>
            </header>

            <!-- 更新时间 -->
            <div class="bg-white rounded-lg card-shadow p-5 mb-6">
                <label class="font-bold text-primary block mb-2">数据更新日期</label>
                <input id="updateTime" class="border w-full md:w-64 px-3 py-2 rounded border-gray-300" placeholder="格式：2026-08-02">
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- B1级 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">B1级挤塑板</h3>
                    <div id="editB1" class="space-y-2"></div>
                    <button onclick="addRow('B1')" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加一行</button>
                </div>
                <!-- B2级 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">B2级挤塑板</h3>
                    <div id="editB2" class="space-y-2"></div>
                    <button onclick="addRow('B2')" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加一行</button>
                </div>
                <!-- 检测级 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">检测级挤塑板</h3>
                    <div id="editTest" class="space-y-2"></div>
                    <button onclick="addRow('test')" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加一行</button>
                </div>
                <!-- EPS聚苯 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">EPS聚苯系列</h3>
                    <div id="editEPS" class="space-y-2"></div>
                    <button onclick="addRow('EPS')" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加一行</button>
                </div>
                <!-- 保温砂浆 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">保温砂浆系列</h3>
                    <div id="editMortar" class="space-y-2"></div>
                    <button onclick="addRow('mortar')" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加一行</button>
                </div>
                <!-- 加价备注 -->
                <div class="bg-white rounded-lg card-shadow p-5">
                    <h3 class="font-bold text-lg mb-3 text-primary">加价补充说明 extraNotes</h3>
                    <div id="editNotes" class="space-y-2"></div>
                    <button onclick="addNote()" class="mt-3 text-blue-600"><i class="fa fa-plus"></i> 添加备注</button>
                </div>
            </div>

            <!-- JSON输出区域 -->
            <div class="mt-8 bg-white rounded-lg card-shadow p-6">
                <h3 class="font-bold text-lg mb-3 text-primary">生成后的JSON数据</h3>
                <textarea id="jsonOutput" class="w-full h-80 border p-3 rounded font-mono text-sm" readonly></textarea>
                <p class="mt-3 text-orange-500 text-sm">⚠️复制全部内容，覆盖仓库内data.json文件，刷新价格页面生效</p>
            </div>

            <footer class="text-center mt-10 text-sm text-gray-400">
                <a href="index.html" class="text-primary">← 返回价格展示页面</a>
            </footer>
        </div>
    </div>

    <script>
        // ========== 配置区 【修改这里可以更改登录密码】 ==========
        const ADMIN_PASSWORD = "Zzy091500."; // 改成你自己的密码！
        // ======================================================

        // 默认基础数据（和首页保持一致）
        let data = {
            updateTime: "2026-08-02",
            B1: [
                {"size":"2公分-9公分", "price":170},
                {"size":"10公分-11公分", "price":180},
                {"size":"12公分-13公分", "price":190},
                {"size":"14公分-15公分", "price":200}
            ],
            B2: [
                {"size":"2公分-3公分", "price":155},
                {"size":"4公分-9公分", "price":160},
                {"size":"10公分-11公分", "price":170},
                {"size":"12公分-13公分", "price":180},
                {"size":"14公分-15公分", "price":190}
            ],
            test: [
                {"size":"2公分-8公分", "price":470},
                {"size":"9公分", "price":480},
                {"size":"10公分", "price":490},
                {"size":"11公分", "price":500},
                {"size":"12公分", "price":510},
                {"size":"13公分", "price":520},
                {"size":"14公分", "price":530},
                {"size":"15公分", "price":540}
            ],
            EPS: [
                {"size":"白聚苯板", "price":9.7},
                {"size":"白聚苯坨", "price":9.5},
                {"size":"石墨聚苯板", "price":11},
                {"size":"石墨聚苯坨", "price":10.8}
            ],
            mortar: [
                {"size":"抗裂砂浆/普通", "price":450},
                {"size":"粘接砂浆/普通", "price":400},
                {"size":"抗裂砂浆/中等", "price":650},
                {"size":"粘接砂浆/中等", "price":600},
                {"size":"抗裂砂浆/检测", "price":850},
                {"size":"粘接砂浆/检测", "price":850}
            ],
            extraNotes: [
                "挤塑2-5公分标准厚度+15元,其他公分数标准厚度+10元。",
                "挤塑28公斤+25元，30公斤+40元，其他每公斤+10元。",
                "挤塑检测35公斤+40元。",
                "挤塑切线条每立方+10元，拉毛开槽+20元。",
                "聚苯切线条按实际尺寸计算，900*600型号+5元。"
            ]
        };

        // 登录
        function login(){
            const val = document.getElementById("pwdInput").value.trim();
            if(val === ADMIN_PASSWORD){
                document.getElementById("loginBox").classList.add("hidden");
                document.getElementById("adminPanel").classList.remove("hidden");
                renderAllEditor();
                watchAutoUpdateJson();
            }else{
                document.getElementById("errTip").classList.remove("hidden");
            }
        }
        function logout(){
            document.getElementById("adminPanel").classList.add("hidden");
            document.getElementById("loginBox").classList.remove("hidden");
            document.getElementById("pwdInput").value = "";
        }

        // 渲染单行编辑框
        function createRowHtml(listKey, index, item){
            return `
            <div class="flex gap-2 items-center">
                <input value="${item.size}" onchange="updateItem('${listKey}',${index},'size',this.value)"
                    class="flex-1 border rounded px-2 py-1.5">
                <input value="${item.price}" onchange="updateItem('${listKey}',${index},'price',Number(this.value))"
                    class="w-20 border rounded px-2 py-1.5">
                <button onclick="delRow('${listKey}',${index})" class="text-red-500"><i class="fa fa-trash"></i></button>
            </div>`;
        }

        // 渲染备注行
        function createNoteHtml(index, text){
            return `
            <div class="flex gap-2 items-center">
                <input value="${text}" onchange="updateNote(${index},this.value)" class="flex-1 border rounded px-2 py-1.5">
                <button onclick="delNote(${index})" class="text-red-500"><i class="fa fa-trash"></i></button>
            </div>`;
        }

        // 整体渲染所有编辑面板
        function renderAllEditor(){
            document.getElementById("updateTime").value = data.updateTime;
            document.getElementById("updateTime").onchange = function(){
                data.updateTime = this.value;
            }

            // 各个商品列表
            renderList("editB1", "B1");
            renderList("editB2", "B2");
            renderList("editTest", "test");
            renderList("editEPS", "EPS");
            renderList("editMortar", "mortar");

            // 备注
            let noteHtml = "";
            data.extraNotes.forEach((txt,i)=>{
                noteHtml += createNoteHtml(i,txt);
            })
            document.getElementById("editNotes").innerHTML = noteHtml;
        }

        function renderList(domId, key){
            let html = "";
            data[key].forEach((item,i)=>{
                html += createRowHtml(key,i,item);
            })
            document.getElementById(domId).innerHTML = html;
        }

        // 更新单元格数据
        function updateItem(listKey, idx, field, val){
            data[listKey][idx][field] = val;
        }
        function updateNote(idx, text){
            data.extraNotes[idx] = text;
        }

        // 删除行
        function delRow(listKey, idx){
            data[listKey].splice(idx,1);
            renderAllEditor();
        }
        function delNote(idx){
            data.extraNotes.splice(idx,1);
            renderAllEditor();
        }

        // 添加一行商品
        function addRow(listKey){
            data[listKey].push({size:"新规格", price:0});
            renderAllEditor();
        }
        // 添加备注
        function addNote(){
            data.extraNotes.push("新增加价说明");
            renderAllEditor();
        }

        // 填充今日日期
        function fillCurrentDate(){
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth()+1).padStart(2,"0");
            const d = String(now.getDate()).padStart(2,"0");
            data.updateTime = `${y}-${m}-${d}`;
            document.getElementById("updateTime").value = data.updateTime;
        }

        // 生成JSON并同步到文本框
        function buildJson(){
            return JSON.stringify(data,null,2);
        }
        function watchAutoUpdateJson(){
            setInterval(()=>{
                document.getElementById("jsonOutput").value = buildJson();
            },300)
        }

        // 复制JSON
        async function copyJson(){
            const text = buildJson();
            try{
                await navigator.clipboard.writeText(text);
                alert("✅ JSON已复制到剪贴板！请上传覆盖data.json");
            }catch(e){
                alert("复制失败，请手动框选文本框内容复制！");
            }
        }

        // 回车登录
        document.getElementById("pwdInput").addEventListener("keydown",e=>{
            if(e.key === "Enter") login();
        })
    </script>
</body>
</html>
