<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价格表管理后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#0F3A76',
                light: '#F3F7FC'
            }
        }
    }
}
</script>
<style>
textarea {white-space: pre;}
/* 登录遮罩 */
#loginMask{
    position: fixed;
    inset: 0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}
</style>
</head>
<body class="bg-light py-6 px-4">

<!-- 登录弹窗 -->
<div id="loginMask">
    <div class="bg-white rounded-lg p-6 w-full max-w-sm shadow-lg">
        <h2 class="text-xl font-bold text-primary mb-4 text-center">🔐 后台权限验证</h2>
        <input id="pwdInput" type="password" placeholder="请输入访问密码" class="w-full border px-3 py-2 rounded mb-4">
        <button onclick="checkPassword()" class="w-full bg-primary text-white py-2 rounded">确认登录</button>
        <p class="text-red-500 text-sm mt-3 hidden text-center" id="pwdTip">密码错误，请重新输入</p>
    </div>
</div>

<div class="max-w-5xl mx-auto bg-white rounded-lg shadow p-6 hidden" id="mainPanel">
    <h1 class="text-2xl font-bold text-primary mb-4"><i class="fa fa-cog mr-2"></i>价格数据管理</h1>
    <div class="mb-4">
        <span class="text-gray-600">JSON文件地址：</span>
        <code class="break-all text-sm">https://cdn.jsdelivr.net/gh/ghzzy17627871234@gmail.comHXXR/data.json</code>
    </div>

    <div class="space-y-4">
        <div>
            <label class="block font-semibold mb-1">最后更新日期（updateTime）</label>
            <input class="w-full border px-3 py-2 rounded" id="updateTime">
        </div>

        <!-- B1 -->
        <div>
            <label class="block font-semibold mb-1">B1级数据（每行：规格,价格）</label>
            <textarea id="areaB1" rows="6" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <!-- B2 -->
        <div>
            <label class="block font-semibold mb-1">B2级数据（每行：规格,价格）</label>
            <textarea id="areaB2" rows="7" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <!-- 检测级 -->
        <div>
            <label class="block font-semibold mb-1">检测级数据（每行：规格,价格）</label>
            <textarea id="areaTest" rows="9" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <!-- EPS聚苯 -->
        <div>
            <label class="block font-semibold mb-1">EPS聚苯系列（每行：名称,价格）</label>
            <textarea id="areaEPS" rows="5" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <!-- 保温砂浆【新增】 -->
        <div>
            <label class="block font-semibold mb-1">保温砂浆系列（每行：名称,价格）</label>
            <textarea id="areaMortar" rows="7" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <!-- 备注 -->
        <div>
            <label class="block font-semibold mb-1">加价说明（一行一条）</label>
            <textarea id="areaNote" rows="6" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
    </div>

    <div class="flex flex-wrap gap-3 mt-6">
        <button onclick="loadRemote()" class="bg-primary text-white px-4 py-2 rounded"><i class="fa fa-refresh"></i> 拉取线上数据</button>
        <button onclick="buildJson()" class="bg-green-600 text-white px-4 py-2 rounded"><i class="fa fa-code"></i> 生成JSON文本</button>
        <button onclick="copyResult()" class="bg-orange-500 text-white px-4 py-2 rounded"><i class="fa fa-copy"></i> 复制JSON</button>
    </div>

    <div class="mt-6">
        <label class="block font-semibold mb-1">生成结果（复制全部，覆盖github上的data.json）</label>
        <textarea id="result" rows="16" readonly class="w-full border px-3 py-2 rounded bg-gray-50"></textarea>
    </div>

    <div class="mt-4 text-sm text-gray-500">
        <p>操作流程：拉取线上数据 → 修改内容 → 生成JSON → 复制全部 → 去Github替换data.json并提交。</p>
        <p class="text-red-500">⚠️ 更新github后，页面需要强制刷新才能看到最新价格！</p>
        <a href="./index.html" class="text-primary underline mt-2 inline-block">← 返回价格表首页</a>
    </div>
</div>

<script>
// =========在这里修改后台访问密码=========
const PASSWORD = "Zzy091500.";
// ========================================

function checkPassword(){
    const input = document.getElementById("pwdInput").value.trim();
    const tip = document.getElementById("pwdTip");
    if(input === PASSWORD){
        document.getElementById("loginMask").style.display = "none";
        document.getElementById("mainPanel").classList.remove("hidden");
    }else{
        tip.classList.remove("hidden");
    }
}

// 回车快速登录
document.getElementById("pwdInput").addEventListener("keydown",e=>{
    if(e.key === "Enter") checkPassword();
})

const DATA_URL = "https://cdn.jsdelivr.net/gh/ghzzy17627871234@gmail.comHXXR/data.json";
let currentJson = null;

// 文本数组转换
function textToList(text){
    const arr = [];
    text.trim().split("\n").forEach(line=>{
        const [size,price] = line.split(",");
        if(size && price !== undefined){
            arr.push({size:size.trim(), price:Number(price.trim())})
        }
    })
    return arr;
}
function listToText(list){
    return list.map(item=>`${item.size},${item.price}`).join("\n");
}

async function loadRemote(){
    try{
        const res = await fetch(DATA_URL+"?t="+Date.now());
        const data = await res.json();
        currentJson = data;
        document.getElementById("updateTime").value = data.updateTime;
        document.getElementById("areaB1").value = listToText(data.B1);
        document.getElementById("areaB2").value = listToText(data.B2);
        document.getElementById("areaTest").value = listToText(data.test);
        document.getElementById("areaEPS").value = listToText(data.EPS);
        document.getElementById("areaMortar").value = listToText(data.mortar);
        document.getElementById("areaNote").value = data.extraNotes.join("\n");
        alert("线上数据加载成功！");
    }catch(e){
        alert("拉取失败："+e.message);
    }
}

function buildJson(){
    const obj = {
        updateTime: document.getElementById("updateTime").value,
        B1: textToList(document.getElementById("areaB1").value),
        B2: textToList(document.getElementById("areaB2").value),
        test: textToList(document.getElementById("areaTest").value),
        EPS: textToList(document.getElementById("areaEPS").value),
        mortar: textToList(document.getElementById("areaMortar").value),
        extraNotes: document.getElementById("areaNote").value.trim().split("\n").map(s=>s.trim())
    };
    const str = JSON.stringify(obj,null,4);
    document.getElementById("result").value = str;
}

function copyResult(){
    const text = document.getElementById("result").value;
    navigator.clipboard.writeText(text).then(()=>{
        alert("JSON已复制！前往Github覆盖data.json");
    })
}
</script>
</body>
</html>
