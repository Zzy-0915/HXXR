<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华夏鑫荣（河北）挤塑价格表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F3A76',
                        secondary: '#235299',
                        light: '#F3F7FC'
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 3px 14px 0 rgba(15, 58, 118, 0.1);
            }
        }
        /* 禁止文字选中复制 */
        * {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-light min-h-screen py-8 px-4 md:px-6">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-[clamp(1.6rem,3vw,2.3rem)] font-bold text-primary">
                <i class="fa fa-file-text-o mr-2"></i>华夏鑫荣（河北）挤塑价格表
            </h1>
            <p class="text-gray-500 mt-2">
                <i class="fa fa-clock-o"></i> 最后更新时间：<span id="timeText">加载中...</span>
            </p>
            <p class="text-sm text-orange-500 mt-1" id="loadTip">正在获取最新价格数据</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
            <!-- B1级 -->
            <div class="bg-white rounded-lg card-shadow overflow-hidden">
                <div class="bg-primary text-white py-3.5 text-center font-bold text-lg">B1级</div>
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 border-b border-gray-200 w-3/5">型号规格</th>
                            <th class="py-3 border-b border-gray-200 w-2/5">单价</th>
                        </tr>
                    </thead>
                    <tbody id="tableB1"></tbody>
                </table>
            </div>
            <!-- B2级 -->
            <div class="bg-white rounded-lg card-shadow overflow-hidden">
                <div class="bg-primary text-white py-3.5 text-center font-bold text-lg">B2级</div>
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 border-b border-gray-200 w-3/5">型号规格</th>
                            <th class="py-3 border-b border-gray-200 w-2/5">单价</th>
                        </tr>
                    </thead>
                    <tbody id="tableB2"></tbody>
                </table>
            </div>
            <!-- 检测级 -->
            <div class="bg-white rounded-lg card-shadow overflow-hidden">
                <div class="bg-primary text-white py-3.5 text-center font-bold text-lg">检测级</div>
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 border-b border-gray-200 w-3/5">型号规格</th>
                            <th class="py-3 border-b border-gray-200 w-2/5">单价</th>
                        </tr>
                    </thead>
                    <tbody id="tableTest"></tbody>
                </table>
            </div>
            <!-- EPS聚苯系列 -->
            <div class="bg-white rounded-lg card-shadow overflow-hidden">
                <div class="bg-primary text-white py-3.5 text-center font-bold text-lg">EPS聚苯系列</div>
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 border-b border-gray-200 w-3/5">产品名称</th>
                            <th class="py-3 border-b border-gray-200 w-2/5">单价(元/KG)</th>
                        </tr>
                    </thead>
                    <tbody id="tableEPS"></tbody>
                </table>
            </div>
            <!-- 保温砂浆系列 -->
            <div class="bg-white rounded-lg card-shadow overflow-hidden">
                <div class="bg-primary text-white py-3.5 text-center font-bold text-lg">保温砂浆系列</div>
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 border-b border-gray-200 w-3/5">产品名称</th>
                            <th class="py-3 border-b border-gray-200 w-2/5">单价(元/吨)</th>
                        </tr>
                    </thead>
                    <tbody id="tableMortar"></tbody>
                </table>
            </div>
        </div>

        <div class="mt-8 bg-white rounded-lg card-shadow p-6">
            <h2 class="font-bold text-lg mb-4 text-primary">📌 加价补充说明</h2>
            <ul id="noteList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-gray-700">
            </ul>
        </div>

        <footer class="text-center mt-10 text-sm text-gray-400">
            华夏鑫荣（河北） | 价格变动以页面最新数据为准
            <div class="mt-2">
                <a href="admin.html" class="text-primary underline">管理后台入口</a>
            </div>
        </footer>
    </div>

    <script>
        const DATA_URL = "https://cdn.jsdelivr.net/gh/ghzzy17627871234@gmail.comHXXR/data.json";

        const defaultData = {
            updateTime: "2026-08-13",
            B1: [
                {"size":"2公分-9公分", "price":170},
                {"size":"10公分-11公分", "price":180},
                {"size":"12公分-13公分", "price":190},
                {"size":"14公分-15公分", "price":200}
            ],
            B2: [
                {"size":"2公分-3公分", "price":155},
                {"size":"4公分-9公分", "price":160},
                {"size":"10公分-11公分", "price":170},
                {"size":"12公分-13公分", "price":180},
                {"size":"14公分-15公分", "price":190}
            ],
            test: [
                {"size":"2公分-8公分", "price":470},
                {"size":"9公分", "price":480},
                {"size":"10公分", "price":490},
                {"size":"11公分", "price":500},
                {"size":"12公分", "price":510},
                {"size":"13公分", "price":520},
                {"size":"14公分", "price":530},
                {"size":"15公分", "price":540}
            ],
            EPS: [
                {"size":"白聚苯板", "price":9.6},
                {"size":"白聚苯坨", "price":9.4},
                {"size":"石墨聚苯板", "price":11},
                {"size":"石墨聚苯坨", "price":10.8}
            ],
            mortar: [
                {"size":"抗裂砂浆/普通", "price":450},
                {"size":"粘接砂浆/普通", "price":400},
                {"size":"抗裂砂浆/中等", "price":650},
                {"size":"粘接砂浆/中等", "price":600},
                {"size":"抗裂砂浆/检测", "price":850},
                {"size":"粘接砂浆/检测", "price":850}
            ],
            extraNotes: [
                "挤塑2-5公分标准厚度+15元，其他公分数标准厚度+10元。",
                "挤塑28公斤+25元，30公斤+40元，其他每公斤+10元。",
                "挤塑检测35公斤+40元。",
                "挤塑切线条每立方+10元，拉毛开槽+20元。",
                "聚苯切线条按实际尺寸计算，900*600型号+5元。"
            ]
        };

        function renderTable(id, list) {
            const dom = document.getElementById(id);
            dom.innerHTML = "";
            list.forEach(row=>{
                dom.innerHTML += `<tr class="hover:bg-blue-50">
                    <td class="py-3 border-b border-gray-100">${row.size}</td>
                    <td class="py-3 border-b border-gray-100 font-semibold text-primary">${row.price}</td>
                </tr>`
            })
        }

        function renderPage(data) {
            document.getElementById('timeText').innerText = data.updateTime;
            document.getElementById("loadTip").innerText = "数据加载完成";
            renderTable("tableB1", data.B1);
            renderTable("tableB2", data.B2);
            renderTable("tableTest", data.test);
            renderTable("tableEPS", data.EPS);
            renderTable("tableMortar", data.mortar);

            const noteWrap = document.getElementById('noteList');
            noteWrap.innerHTML = "";
            data.extraNotes.forEach(txt=>{
                noteWrap.innerHTML += `<li class="bg-light px-4 py-3 rounded"><i class="fa fa-plus-circle text-primary mr-2"></i>${txt}</li>`
            })
        }

        fetch(DATA_URL + "?t=" + Date.now())
            .then(res=>res.json())
            .then(json=>{
                renderPage(json);
            })
            .catch(err=>{
                console.log("远程数据加载失败，使用本地默认数据",err);
                renderPage(defaultData);
                document.getElementById("loadTip").innerText = "⚠️ 无法连接服务器，显示内置默认价格";
            })
    </script>
</body>
</html>
